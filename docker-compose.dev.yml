services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prymeira_talk
    ports:
      - "54329:5432"
    volumes:
      - prymeira-talk-postgres:/var/lib/postgresql/data

  google-maps-scraper:
    image: gosom/google-maps-scraper:v1.15.0
    command: ["-web", "-data-folder", "/gmapsdata"]
    ports:
      - "127.0.0.1:${GOOGLE_MAPS_SCRAPER_PORT:-8080}:8080"
    volumes:
      - prymeira-talk-google-maps-scraper-data:/gmapsdata
      - prymeira-talk-google-maps-scraper-cache:/opt

volumes:
  prymeira-talk-postgres:
  prymeira-talk-google-maps-scraper-data:
  prymeira-talk-google-maps-scraper-cache:
