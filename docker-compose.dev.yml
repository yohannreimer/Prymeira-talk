services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prymeira_talk
    ports:
      - "54329:5432"
    volumes:
      - prymeira-talk-postgres:/var/lib/postgresql/data

  google-maps-scraper:
    image: gosom/google-maps-scraper:v1.18.1@sha256:e205c02913c5a69c16fc2094b8e5b194a2f655166d2c1126d50548d216e6b1b2
    command: ["-web", "-data-folder", "/gmapsdata"]
    ports:
      - "127.0.0.1:${GOOGLE_MAPS_SCRAPER_PORT:-8080}:8080"
    volumes:
      - prymeira-talk-google-maps-scraper-data:/gmapsdata

volumes:
  prymeira-talk-postgres:
  prymeira-talk-google-maps-scraper-data:
