services:
  prymeira_talk_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prymeira_talk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${PRYMEIRA_TALK_POSTGRES_PASSWORD}
    volumes:
      - prymeira_talk_postgres:/var/lib/postgresql/data
    networks:
      prymeira_talk_internal:
        aliases:
          - postgres
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.hostname == manager01
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
      restart_policy:
        condition: on-failure

  prymeira_talk_api:
    image: ghcr.io/${GHCR_OWNER:-yohannreimer}/prymeira-talk-api:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${PRYMEIRA_TALK_POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-prymeira_talk}
      CORS_ORIGINS: https://talk.prymeiradigital.com.br
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_TIME_WINDOW: ${RATE_LIMIT_TIME_WINDOW:-1 minute}
      PRYMEIRA_ACCOUNT_API_URL: https://hub.prymeiradigital.com.br/api
      PRYMEIRA_LOCAL_AUTH_BYPASS: "false"
      PRYMEIRA_LOCAL_WORKSPACE_ID: local_workspace
      PRYMEIRA_LOCAL_ROLE: owner
      PRYMEIRA_PRODUCT_KEY: talk
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      PUBLIC_TALK_URL: https://talk.prymeiradigital.com.br
      LOCAL_TALK_URL: http://talk_api:3002
      EVOLUTION_MODE: real
      EVOLUTION_API_BASE_URL: https://wsapi.yrdnegocios.com.br
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET}
      VINCULA_CRM_API_URL: ${VINCULA_CRM_API_URL:-https://vincula.prymeiradigital.com.br/api}
    networks:
      prymeira_talk_internal:
        aliases:
          - api
          - talk_api
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.hostname == manager01
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
      restart_policy:
        condition: on-failure

  prymeira_talk_web:
    image: ghcr.io/${GHCR_OWNER:-yohannreimer}/prymeira-talk-web:${IMAGE_TAG:-latest}
    environment:
      VITE_API_URL: https://talk.prymeiradigital.com.br/api
      VITE_LOCAL_AUTH_BYPASS: "false"
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    networks:
      - network_swarm_public
      - prymeira_talk_internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.hostname == manager01
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_swarm_public
        - traefik.http.routers.prymeira_talk_web.rule=Host(`talk.prymeiradigital.com.br`)
        - traefik.http.routers.prymeira_talk_web.entrypoints=websecure
        - traefik.http.routers.prymeira_talk_web.tls.certresolver=letsencryptresolver
        - traefik.http.routers.prymeira_talk_web.service=prymeira_talk_web
        - traefik.http.services.prymeira_talk_web.loadbalancer.server.port=80

volumes:
  prymeira_talk_postgres:

networks:
  network_swarm_public:
    external: true
  prymeira_talk_internal:
    driver: overlay
