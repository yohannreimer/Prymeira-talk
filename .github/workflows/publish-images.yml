name: Isolated visible message resource comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    services:
      postgres:
        image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
        env:
          POSTGRES_USER: talk_test
          POSTGRES_PASSWORD: talk_test
          POSTGRES_DB: postgres
          PGDATA: /var/lib/postgresql/data/talk_fixture
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U talk_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.12.14-alpine@sha256:97907aceae0a6fbfb24847724adadf12f536a2b9bf547a42bc9dad153ed74e99
        env:
          RABBITMQ_DEFAULT_USER: talk_test
          RABBITMQ_DEFAULT_PASS: talk_test
          RABBITMQ_DEFAULT_VHOST: talk_test
        ports: ['56739:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TALK_TEST_POSTGRES_PORT: 55439
      TALK_TEST_AMQP_PORT: 56739
      TALK_TEST_POSTGRES_DATA_DIRECTORY: /var/lib/postgresql/data/talk_fixture
      TALK_TEST_DATABASE_ADMIN_URL: postgresql://talk_test:talk_test@127.0.0.1:55439/postgres
      REHEARSAL_DATABASE_URL: postgresql://talk_test:talk_test@127.0.0.1:55439/talk_rehearsal
      INGRESS_TEST_AMQP_URL: amqp://talk_test:talk_test@127.0.0.1:56739/talk_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prymeira-talk/api exec prisma generate --schema prisma/schema.prisma
      - name: Python browser tooling
        run: |
          python3 -m pip install playwright==1.64.0
          python3 -m playwright install --with-deps chromium
          python3 .github/ui-comparison/observer-test.py
      - name: Verify owned comparison tooling
        run: node --test .github/comparison/isolation.test.mjs .github/comparison/deadline.test.mjs .github/ui-comparison/analyze.test.mjs .github/ui-comparison/limits.test.mjs
      - name: Verify composed current API candidate
        run: |
          pnpm --filter @prymeira-talk/api typecheck
          mkdir -p apps/api/tmp
          cp .github/ui-comparison/payload-contract.test.ts apps/api/tmp/ui-payload-contract.test.ts
          pnpm --filter @prymeira-talk/api exec vitest run tmp/ui-payload-contract.test.ts src/modules/channels/outbound-router.safety.test.ts src/modules/channels/outbound-router.destination.test.ts src/modules/channels/outbound-router.read.test.ts src/modules/channels/outbound-routing.test.ts src/modules/followups/contextual-followup-policy.test.ts src/modules/followups/contextual-followup-engine.test.ts src/modules/followups/contextual-followup-context.test.ts src/modules/followups/contextual-followup-profiles.test.ts src/modules/harness/agentes/followup/followup.test.ts --maxWorkers=1 --fileParallelism=false
          pnpm --filter @prymeira-talk/api harness:replay-contextual-followups
      - name: Fetch immutable source revisions, without production access
        run: |
          set -eu
          mkdir -p validation-artifacts .validation/variants
          for sha in 99f65ed54a2ca729434b39786bdcb6394d8f9388 51b1fdd75341013b613737e61d3e89b787cec8be 1d7aa19ed9c4a48532937408b9ece782c53d5cd6 c9d49c82d6d64131921588dbf79166ee254f067e f2ff10305183d0a866d2564067f82f520dc7258b; do
            git fetch --no-tags origin "$sha"
            mkdir -p ".validation/variants/$sha"
            git archive "$sha" | tar -x -C ".validation/variants/$sha"
          done
          git rev-parse HEAD > validation-artifacts/controller-sha.txt
          uname -a > validation-artifacts/platform.txt
          lscpu -J > validation-artifacts/cpu.json
      - name: Build all variants on one pinned local Node base, no image publication
        run: |
          set -eu
          docker pull node@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
          docker tag node@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402 node:22-alpine
          docker image inspect node:22-alpine --format '{{json .}}' > validation-artifacts/common-node-base.json
          for pair in A_ingress:99f65ed54a2ca729434b39786bdcb6394d8f9388 A_worker:51b1fdd75341013b613737e61d3e89b787cec8be A_api:c9d49c82d6d64131921588dbf79166ee254f067e N:f2ff10305183d0a866d2564067f82f520dc7258b; do
            name=${pair%%:*}
            sha=${pair#*:}
            docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$sha" -f ".validation/variants/$sha/apps/api/Dockerfile" -t "talk-compare-${name,,}" ".validation/variants/$sha"
            docker image inspect "talk-compare-${name,,}" --format '{{json .}}' > "validation-artifacts/image-$name.json"
          done
          for pair in A_web:1d7aa19ed9c4a48532937408b9ece782c53d5cd6 N_web:f2ff10305183d0a866d2564067f82f520dc7258b; do
            name=${pair%%:*}
            sha=${pair#*:}
            docker build --platform linux/amd64 -f ".validation/variants/$sha/apps/web/Dockerfile" -t "talk-compare-${name,,}" ".validation/variants/$sha"
            docker image inspect "talk-compare-${name,,}" --format '{{json .}}' > "validation-artifacts/image-$name.json"
          done
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const images=Object.fromEntries(['A_ingress','A_worker','A_api','N','A_web','N_web'].map(n=>[n,JSON.parse(fs.readFileSync(`validation-artifacts/image-${n}.json`)).Id]));
          fs.writeFileSync('validation-artifacts/images.json',JSON.stringify(images,null,2));
          JS
      - name: Paired actual visible UI with current VPS and candidate
        env:
          UI_COMPARISON_PILOT: false
          UI_COMPARISON_PROFILES: busy
          UI_COMPARISON_LIMIT_EXPERIMENT: true
          TALK_COMPARE_PG_ID: ${{ job.services.postgres.id }}
          TALK_COMPARE_RABBIT_ID: ${{ job.services.rabbitmq.id }}
        run: node .github/ui-comparison/run.mjs
      - name: Stop only comparison-labelled containers
        if: always()
        run: |
          ids=$(docker ps -aq --filter "label=talk.compare=vps-compare-$GITHUB_RUN_ID")
          if [ -n "$ids" ]; then docker rm -f $ids; fi
      - name: Preserve synthetic comparison evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visible-message-comparison-${{ github.sha }}
          path: validation-artifacts/
          if-no-files-found: error
          retention-days: 3
