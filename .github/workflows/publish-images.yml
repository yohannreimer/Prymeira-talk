name: Isolated admission and recovery diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
        env:
          POSTGRES_USER: talk_test
          POSTGRES_PASSWORD: talk_test
          POSTGRES_DB: postgres
          PGDATA: /var/lib/postgresql/data/talk_fixture
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U talk_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.12.14-alpine@sha256:97907aceae0a6fbfb24847724adadf12f536a2b9bf547a42bc9dad153ed74e99
        env:
          RABBITMQ_DEFAULT_USER: talk_test
          RABBITMQ_DEFAULT_PASS: talk_test
          RABBITMQ_DEFAULT_VHOST: talk_test
        ports: ['56739:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TALK_TEST_POSTGRES_PORT: 55439
      TALK_TEST_AMQP_PORT: 56739
      TALK_TEST_POSTGRES_DATA_DIRECTORY: /var/lib/postgresql/data/talk_fixture
      TALK_TEST_DATABASE_ADMIN_URL: postgresql://talk_test:talk_test@127.0.0.1:55439/postgres
      REHEARSAL_DATABASE_URL: postgresql://talk_test:talk_test@127.0.0.1:55439/talk_rehearsal
      INGRESS_TEST_AMQP_URL: amqp://talk_test:talk_test@127.0.0.1:56739/talk_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prymeira-talk/api exec prisma generate --schema prisma/schema.prisma
      - name: Verify owned comparison tooling
        run: node --test .github/comparison/isolation.test.mjs .github/comparison/deadline.test.mjs
      - name: Fetch immutable source revisions, without production access
        run: |
          set -eu
          mkdir -p validation-artifacts .validation/variants
          for sha in 99f65ed54a2ca729434b39786bdcb6394d8f9388 51b1fdd75341013b613737e61d3e89b787cec8be 1d7aa19ed9c4a48532937408b9ece782c53d5cd6 4c718f6f8b3450e1633697bef5e45381ab813dcb da7a017ad53d3265396ec41e8fde8c49e360215f; do
            git fetch --no-tags origin "$sha"
            mkdir -p ".validation/variants/$sha"
            git archive "$sha" | tar -x -C ".validation/variants/$sha"
          done
          git rev-parse HEAD > validation-artifacts/controller-sha.txt
          uname -a > validation-artifacts/platform.txt
      - name: Build all variants on one pinned local Node base, no image publication
        run: |
          set -eu
          docker pull node:22-alpine
          docker image inspect node:22-alpine --format '{{json .}}' > validation-artifacts/common-node-base.json
          for pair in A_ingress:99f65ed54a2ca729434b39786bdcb6394d8f9388 A_worker:51b1fdd75341013b613737e61d3e89b787cec8be B:1d7aa19ed9c4a48532937408b9ece782c53d5cd6 C:4c718f6f8b3450e1633697bef5e45381ab813dcb E:da7a017ad53d3265396ec41e8fde8c49e360215f; do
            name=${pair%%:*}
            sha=${pair#*:}
            docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$sha" -f ".validation/variants/$sha/apps/api/Dockerfile" -t "talk-compare-${name,,}" ".validation/variants/$sha"
            docker image inspect "talk-compare-${name,,}" --format '{{json .}}' > "validation-artifacts/image-$name.json"
          done
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const images=Object.fromEntries(['A_ingress','A_worker','B','C','E'].map(n=>[n,JSON.parse(fs.readFileSync(`validation-artifacts/image-${n}.json`)).Id]));
          fs.writeFileSync('validation-artifacts/images.json',JSON.stringify(images,null,2));
          JS
      - name: Repeat exact offer windows and isolate ingress CPU quota
        env:
          TALK_COMPARE_PG_ID: ${{ job.services.postgres.id }}
          TALK_COMPARE_RABBIT_ID: ${{ job.services.rabbitmq.id }}
        run: node .github/comparison/run.mjs
      - name: Stop only comparison-labelled containers
        if: always()
        run: |
          ids=$(docker ps -aq --filter "label=talk.compare=vps-compare-$GITHUB_RUN_ID")
          if [ -n "$ids" ]; then docker rm -f $ids; fi
      - name: Preserve synthetic comparison evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matched-vps-comparison-${{ github.sha }}
          path: validation-artifacts/
          if-no-files-found: error
          retention-days: 3
