name: Isolated canonical read reduction comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    services:
      postgres:
        image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
        env:
          POSTGRES_USER: talk_test
          POSTGRES_PASSWORD: talk_test
          POSTGRES_DB: postgres
          PGDATA: /var/lib/postgresql/data/talk_fixture
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U talk_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.12.14-alpine@sha256:97907aceae0a6fbfb24847724adadf12f536a2b9bf547a42bc9dad153ed74e99
        env:
          RABBITMQ_DEFAULT_USER: talk_test
          RABBITMQ_DEFAULT_PASS: talk_test
          RABBITMQ_DEFAULT_VHOST: talk_test
        ports: ['56739:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TALK_TEST_POSTGRES_PORT: 55439
      TALK_TEST_AMQP_PORT: 56739
      TALK_TEST_POSTGRES_DATA_DIRECTORY: /var/lib/postgresql/data/talk_fixture
      TALK_TEST_DATABASE_ADMIN_URL: postgresql://talk_test:talk_test@127.0.0.1:55439/postgres
      REHEARSAL_DATABASE_URL: postgresql://talk_test:talk_test@127.0.0.1:55439/talk_rehearsal
      INGRESS_TEST_AMQP_URL: amqp://talk_test:talk_test@127.0.0.1:56739/talk_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prymeira-talk/api exec prisma generate --schema prisma/schema.prisma
      - name: Python browser tooling
        run: |
          python3 -m pip install playwright==1.64.0
          python3 -m playwright install --with-deps chromium
          python3 .github/ui-comparison/observer-test.py
          python3 .github/ui-comparison/viewport-test.py
      - name: Verify owned comparison tooling
        run: node --test .github/comparison/isolation.test.mjs .github/comparison/deadline.test.mjs .github/ui-comparison/analyze.test.mjs .github/ui-comparison/limits.test.mjs .github/ui-comparison/trace.test.mjs .github/ui-comparison/concurrency-plan.test.mjs .github/ui-comparison/terminal.test.mjs .github/ui-comparison/transaction-timing.test.mjs
      - name: Verify composed current API candidate
        run: |
          pnpm --filter @prymeira-talk/api typecheck
          mkdir -p apps/api/tmp
          cp .github/ui-comparison/payload-contract.test.ts apps/api/tmp/ui-payload-contract.test.ts
          pnpm --filter @prymeira-talk/api exec vitest run tmp/ui-payload-contract.test.ts src/modules/ingress/effect-batch.test.ts src/modules/ingress/runtime.test.ts src/modules/ingress/application.retry.test.ts src/modules/ingress/effect-handlers.test.ts src/modules/ingress/consumer-observability.test.ts src/modules/channels/outbound-router.safety.test.ts src/modules/channels/outbound-router.destination.test.ts src/modules/channels/outbound-router.read.test.ts src/modules/channels/outbound-routing.test.ts src/modules/followups/contextual-followup-policy.test.ts src/modules/followups/contextual-followup-engine.test.ts src/modules/followups/contextual-followup-context.test.ts src/modules/followups/contextual-followup-profiles.test.ts src/modules/harness/agentes/followup/followup.test.ts --maxWorkers=1 --fileParallelism=false
          pnpm --filter @prymeira-talk/api harness:replay-contextual-followups
      - name: Fetch immutable source revisions, without production access
        run: |
          set -eu
          mkdir -p validation-artifacts .validation/variants
          for sha in 84fdda859a4498f7e8ff8dde0143e2d590fa4e71 "$GITHUB_SHA"; do
            git fetch --no-tags origin "$sha"
            mkdir -p ".validation/variants/$sha"
            git archive "$sha" | tar -x -C ".validation/variants/$sha"
          done
          git rev-parse HEAD > validation-artifacts/controller-sha.txt
          uname -a > validation-artifacts/platform.txt
          lscpu -J > validation-artifacts/cpu.json
      - name: Qualify canonical invariants with actual PostgreSQL and RabbitMQ
        env:
          DATABASE_URL: postgresql://talk_test:talk_test@127.0.0.1:55439/messaging_test
          MESSAGING_TEST_DATABASE_URL: postgresql://talk_test:talk_test@127.0.0.1:55439/messaging_test
        run: |
          node --input-type=module <<'JS'
          import {createRequire} from 'node:module';
          const require=createRequire(new URL('./apps/api/package.json',import.meta.url)),{Client}=require('pg');
          const u=new URL(process.env.TALK_TEST_DATABASE_ADMIN_URL);
          if(u.hostname!=='127.0.0.1'||u.port!=='55439'||u.pathname!=='/postgres')throw Error('Owned admin only');
          const db=new Client({connectionString:u.href});await db.connect();
          if((await db.query("SHOW data_directory")).rows[0].data_directory!=='/var/lib/postgresql/data/talk_fixture')throw Error('Owned data directory only');
          await db.query('CREATE DATABASE messaging_test');await db.end();
          JS
          node --input-type=module <<'JS'
          import fs from 'node:fs';import os from 'node:os';import path from 'node:path';
          console.log('FIXTURE_TEMP_ROOT',JSON.stringify({legacyExists:fs.existsSync('/private/tmp'),actual:os.tmpdir()}));
          const owned=fs.mkdtempSync(path.join(os.tmpdir(),'talk-fixture-portability-'));fs.rmdirSync(owned);
          JS
          pnpm --filter @prymeira-talk/api exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm --filter @prymeira-talk/api build:prod
          pnpm --filter @prymeira-talk/api exec vitest run src/modules/messaging/canonical-store.postgres.test.ts src/modules/messaging/canonical-foundation.postgres.test.ts src/modules/messaging/canonical-reducers.postgres.test.ts src/modules/messaging/outbound-fences.postgres.test.ts src/modules/messaging/outbound-intents.postgres.test.ts src/modules/messaging/conversation-preview.postgres.test.ts src/modules/ingress/application.postgres.test.ts src/modules/ingress/effect-batch.postgres.test.ts src/modules/ingress/effect-runner.postgres.test.ts src/modules/ingress/recertification-queue.postgres.test.ts src/modules/ingress/transport.postgres.test.ts src/modules/ingress/publication-lease.postgres.test.ts src/modules/ingress/setup.rabbit.test.ts --maxWorkers=1 --fileParallelism=false --reporter=default --reporter=json --outputFile="$GITHUB_WORKSPACE/validation-artifacts/topology-postgres.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('validation-artifacts/topology-postgres.json'));
          if(!d.success||d.numTotalTests<454||d.numPendingTests||d.numFailedTests||d.numPassedTests!==d.numTotalTests)throw Error('Nonempty, unskipped PostgreSQL/Rabbit qualification required');
          console.log('EFFECT_BATCH_INVARIANTS',JSON.stringify({passed:d.numPassedTests,failed:d.numFailedTests,pending:d.numPendingTests}));
          JS
      - name: Build immutable reference candidate and diagnostic worker images without publication
        run: |
          set -eu
          reference=84fdda859a4498f7e8ff8dde0143e2d590fa4e71
          git diff --exit-code "$reference" "$GITHUB_SHA" -- apps/api/prisma packages apps/web pnpm-lock.yaml
          git diff "$reference" "$GITHUB_SHA" -- apps/api/src > validation-artifacts/product-source.patch
          docker pull node@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
          docker tag node@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402 node:22-alpine
          docker image inspect node:22-alpine --format '{{json .}}' > validation-artifacts/common-node-base.json
          for pair in R:$reference N:$GITHUB_SHA; do
            name=${pair%%:*}
            sha=${pair#*:}
            docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$sha" -f ".validation/variants/$sha/apps/api/Dockerfile" -t "talk-reads-${name,,}" ".validation/variants/$sha"
            docker image inspect "talk-reads-${name,,}" --format '{{json .}}' > "validation-artifacts/image-$name.json"
            docker build --platform linux/amd64 -f ".validation/variants/$sha/apps/web/Dockerfile" -t "talk-reads-${name,,}-web" ".validation/variants/$sha"
            docker image inspect "talk-reads-${name,,}-web" --format '{{json .}}' > "validation-artifacts/image-${name}_web.json"
          done
          dest=".validation/variants/$GITHUB_SHA-transaction-timing"
          cp -a ".validation/variants/$GITHUB_SHA" "$dest"
          node .github/ui-comparison/transaction-timing-instrument.mjs "$dest"
          cp "$dest/transaction-timing-patch.json" validation-artifacts/transaction-timing-patch.json
          git diff --no-index ".validation/variants/$GITHUB_SHA/apps/api/src" "$dest/apps/api/src" > validation-artifacts/diagnostic-source.patch || test "$?" = 1
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" --label talk.compare.transaction-timing=true -f "$dest/apps/api/Dockerfile" -t talk-reads-nd "$dest"
          docker image inspect talk-reads-nd --format '{{json .}}' > validation-artifacts/image-ND.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';const images=Object.fromEntries(['R','N','ND','R_web','N_web'].map(n=>[n,JSON.parse(fs.readFileSync(`validation-artifacts/image-${n}.json`)).Id]));
          fs.writeFileSync('validation-artifacts/images.json',JSON.stringify(images,null,2));
          JS
      - name: Paired normal read reduction comparison and separate diagnostic
        env:
          TALK_COMPARE_PG_ID: ${{ job.services.postgres.id }}
          TALK_COMPARE_RABBIT_ID: ${{ job.services.rabbitmq.id }}
        run: node .github/ui-comparison/read-reduction-experiment.mjs
      - name: Stop only comparison-labelled containers
        if: always()
        run: |
          ids=$(docker ps -aq --filter "label=talk.compare=vps-compare-$GITHUB_RUN_ID")
          if [ -n "$ids" ]; then docker rm -f $ids; fi
      - name: Preserve synthetic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-reduction-${{ github.sha }}
          path: validation-artifacts/
          if-no-files-found: error
          retention-days: 7
